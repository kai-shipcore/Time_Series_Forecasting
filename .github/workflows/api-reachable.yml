name: API reachable

# Is http://144.24.40.252:8000 answering from OUTSIDE the server?
#
# The deploy asserts the unit is healthy at deploy time. Nothing checked the
# hours in between, which is how the port sat broken from Friday 5pm to Monday
# afternoon in August 2026 with nobody aware. This closes that window.
#
# Runs on a GitHub runner, which is off the network entirely, so it exercises
# the same path a laptop or a colleague's machine uses. Checking from the server
# itself would pass even when the service is bound to loopback, which is exactly
# the failure this is meant to catch.
#
# Fails loudly on purpose: a red scheduled run emails whoever owns the repo.
#
# NOTE: GitHub disables scheduled workflows after 60 days without repo activity.
# If this stops running, that is why, and the Actions tab offers a re-enable
# button.

on:
  schedule:
    - cron: '17 * * * *'   # hourly at :17, off the hour to avoid the busy minute
  workflow_dispatch:

jobs:
  reachable:
    name: Can an outside machine reach the forecast API
    runs-on: ubuntu-latest

    steps:
      - name: /health answers from outside
        run: |
          set -uo pipefail
          API="http://144.24.40.252:8000"

          # --max-time, not --connect-timeout: a cloud firewall DROPS rather than
          # refuses, so a blocked port hangs instead of erroring, and only a
          # total timeout catches that.
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 15 "$API/health" || echo 000)

          if [ "$code" != "200" ]; then
            echo "::error::/health returned '$code' from outside the server."
            echo "  000 with a hang    -> packets are being dropped (OCI security list)."
            echo "  000 fast, refused  -> nothing listening on the public interface;"
            echo "                        the service is on loopback or is down."
            echo "  anything else      -> it answered, but not with 200."
            echo "Run the 'Server diagnostics' workflow for the socket owner and journal."
            exit 1
          fi

          ready=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('ready'))")
          echo "reachable, ready=$ready"

          # ready=False means the API is up but has no data to serve, which is a
          # real outage for the planning pages even though the port is fine.
          if [ "$ready" != "True" ]; then
            echo "::error::API is reachable but ready=$ready, so it has no data to serve."
            exit 1
          fi

      # Only needed for the tip commit and its timestamp. fetch-depth 1 is
      # enough: nothing here walks history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: the serving commit is the tip of main
        run: |
          set -uo pipefail
          # BACKLOG 20. On 2026-08-06 a commit was pushed to main, the remote
          # branch moved, and no workflow run was ever created. Nothing reported
          # it: from the terminal a push that deploys and a push that does not
          # look identical, so a bug fix sat undeployed for a day while work
          # continued on top of it. This is the check that would have said so.
          deployed=$(python3 -c "import json;print(json.load(open('/tmp/health.json')).get('commit') or '')")
          tip="${{ github.sha }}"

          if [ -z "$deployed" ]; then
            echo "::warning::/health reports no commit. Expected until the deploy that ships this mechanism has run once; investigate if it persists."
            exit 0
          fi
          if [ "$deployed" = "$tip" ]; then
            echo "serving ${deployed}, which is the tip of main"
            exit 0
          fi

          # A deploy takes a couple of minutes, so a mismatch straight after a
          # push is normal rather than a fault. Only complain once the tip has
          # been sitting there long enough that a deploy would have finished.
          age=$(( $(date +%s) - $(git show -s --format=%ct HEAD) ))
          echo "serving ${deployed}, tip of main is ${tip} (pushed ${age}s ago)"
          if [ "$age" -lt 1800 ]; then
            echo "::notice::Mismatch, but the tip is under 30 minutes old, so a deploy is probably still running."
            exit 0
          fi

          echo "::error::The server has been running a commit that is not the tip of main for over 30 minutes."
          echo "  serving:     ${deployed}"
          echo "  tip of main: ${tip}"
          echo "Most likely no workflow run was created for that push; the Actions tab shows a banner when runs are disabled or limited."
          echo "Less likely, a deploy ran and the restart did not replace the serving process, but the deploy asserts the commit now and would have failed."
          exit 1

      - name: auth is still enforced
        run: |
          set -uo pipefail
          # 401 is the pass. Anything else means the token stopped being applied
          # and the four POST endpoints, /planning/run-forecast and
          # /planning/prepare-data among them, are open to the internet, which is
          # worse than the port being down.
          #
          # PROBE A ROUTE THAT EXISTS. This checked /segmentation until
          # 2026-08-13, when the statsforecast router was unmounted. The middleware
          # runs before routing, so an unmounted path still answers 401 while the
          # token is set, and the check went on passing. It would have failed to
          # do its job in the one case it exists for: with the token unset, the
          # request reaches routing and a deleted path returns 404, not 200, so
          # the "unauthenticated on a public port" branch below would never have
          # fired. A security check that cannot detect the thing it watches for is
          # worse than none, because it reports success.
          #
          # /planning/demand-patterns is on the live track and returns 200 with a
          # valid token, so an unauthenticated 200 here is unambiguous.
          PROBE=/planning/demand-patterns
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                 "http://144.24.40.252:8000${PROBE}" || echo 000)
          if [ "$code" = "401" ]; then
            echo "401 as expected, token enforced"
            exit 0
          fi
          if [ "$code" = "404" ]; then
            echo "::error::${PROBE} returned 404 with no token. Either the route was"
            echo "removed and this check needs repointing at a live one, or the token"
            echo "is unset and the request reached routing. Both need a human."
            exit 1
          fi
          echo "::error::${PROBE} returned '$code' with NO token, expected 401."
          echo "If this is 200 the API is unauthenticated on a public port. Check"
          echo "FORECAST_API_TOKEN in the server's .env and restart the service."
          exit 1
