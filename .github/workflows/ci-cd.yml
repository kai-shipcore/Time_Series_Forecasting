name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall api src scripts config.py

      - name: Smoke test FastAPI app
        run: |
          python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              kill "$SERVER_PID"
              wait "$SERVER_PID" || true
              exit 0
            fi
            sleep 1
          done
          kill "$SERVER_PID" || true
          wait "$SERVER_PID" || true
          exit 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # The deploy owns code. The weekly cron owns data. Nothing owns both.
      #
      # data/ and outputs/ are gitignored, so this checkout contains none of
      # them. Without these excludes, --delete would remove the server's copies
      # on every deploy and leave the API serving 500s until the next Monday.
      # rsync protects excluded paths from --delete, so naming them here is both
      # "do not upload" and "do not destroy".
      - name: Upload release files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEPLOY_PORT || 22 }} -o StrictHostKeyChecking=accept-new" \
            --exclude ".git/" \
            --exclude ".github/" \
            --exclude ".venv/" \
            --exclude ".env" \
            --exclude "__pycache__/" \
            --exclude ".pytest_cache/" \
            --exclude "data/" \
            --exclude "outputs/" \
            --exclude "logs/" \
            --exclude ".deployed_commit" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      # Record which revision is on disk, before the restart, so the service
      # reads it at startup and can report it from /health. Excluded from the
      # rsync above for the usual reason: --delete would remove it every deploy
      # because it is not in the source tree, leaving a window where the file is
      # gone and the answer is "unknown" rather than wrong.
      - name: Stamp the deployed commit
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "printf '%s\n' '${{ github.sha }}' > '${{ secrets.DEPLOY_PATH }}/.deployed_commit'"

      - name: Install dependencies and restart service
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"

          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi

          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # `systemctl cat`, not `list-unit-files | grep -q`. The pipeline
          # version was the cause of the port-8000 squatter, and the mechanism
          # is worth stating because it looks like working code:
          #
          #   set -o pipefail is active. `grep -q` exits at its FIRST match and
          #   closes the pipe. `systemctl list-unit-files` prints hundreds of
          #   units, so it is still writing, dies of SIGPIPE and returns 141.
          #   pipefail makes that 141 the status of the whole pipeline. So the
          #   condition evaluated FALSE every time even though the unit was
          #   found, both systemd branches were skipped, and the fallback ran.
          #
          # The fallback then `pkill`ed the systemd-managed process and started
          # its own uvicorn on loopback, which systemd could not displace: it
          # restarted under Restart=always, failed to bind, and crash-looped,
          # while the deploy reported green because the readiness check below
          # only proves SOMETHING from this directory is answering. Observed
          # twice on 2026-08-07 (pids 3152116 and 3269753). See BACKLOG 21.
          #
          # `systemctl cat` takes a unit name directly, needs no pipe, and
          # returns non-zero when the unit does not exist.
          if command -v systemctl >/dev/null 2>&1 && systemctl cat coverland-forecast-api.service >/dev/null 2>&1; then
            sudo systemctl restart coverland-forecast-api
          elif command -v systemctl >/dev/null 2>&1 && systemctl --user cat coverland-forecast-api.service >/dev/null 2>&1; then
            systemctl --user restart coverland-forecast-api
          else
            # Only for a box with no systemd unit at all. Binds 0.0.0.0 to match
            # the unit, which changed on 2026-08-07 so the API is reachable off
            # the box; a loopback fallback here would silently undo that.
            pkill -f 'uvicorn api.main:app' || true
            nohup .venv/bin/python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          fi

          # Assert the unit actually came up. `systemctl restart` exits 0 even
          # when the service then fails to start, so without this a crash-loop
          # is a green build. A unit that is restarting reports
          # "activating (auto-restart)", never "active".
          if command -v systemctl >/dev/null 2>&1 && systemctl cat coverland-forecast-api.service >/dev/null 2>&1; then
            # Wait BEFORE looking, then check twice. `systemctl restart` returns
            # as soon as the process starts, and uvicorn needs a second or two to
            # reach a bind error and exit, so the unit reports "active" during
            # that window. An earlier version polled immediately and broke on the
            # first "active", which let a crash-looping unit pass on 2026-08-10.
            sleep 8
            state=$(systemctl is-active coverland-forecast-api || true)
            sleep 5
            state2=$(systemctl is-active coverland-forecast-api || true)

            # And the port, which is the thing that actually matters. A unit can
            # be "active" while something else owns 8000; that is the squatter
            # state, and it is invisible to is-active alone.
            bound=$(ss -lnt | grep -c '0\.0\.0\.0:8000' || true)

            if [ "$state" != "active" ] || [ "$state2" != "active" ] || [ "$bound" -eq 0 ]; then
              echo "::error::forecast API unhealthy after restart: state=$state then $state2, 0.0.0.0:8000 listeners=$bound"
              echo "--- who holds 8000 ---"
              ss -lntp | grep 8000 || echo "  nothing listening"
              echo "--- uvicorn processes (a relative venv path means it is not systemd's) ---"
              ps -eo pid,ppid,lstart,cmd | grep -E 'uvicorn|api.main' | grep -v grep || true
              echo "--- journal ---"
              journalctl -u coverland-forecast-api -n 25 --no-pager || true
              exit 1
            fi
            echo "unit active and holding 0.0.0.0:8000"
          fi
          EOF

      # Reports rather than fails. A deploy that lands on a server whose data
      # has not been pushed yet is expected on the first run, and the fix is a
      # cron push, not a rollback. But it must be visible here: the failure it
      # produces otherwise is a 500 on every planning page, which is a long way
      # from this log.
      - name: Report data readiness
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || 22 }}" -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
          set -uo pipefail
          for i in $(seq 1 20); do
            body=$(curl --fail --silent --max-time 5 http://127.0.0.1:8000/health) && break
            sleep 1
          done

          if [ -z "${body:-}" ]; then
            echo "::warning::The API did not answer /health after the restart."
            exit 0
          fi

          # Whose answer is this? If another service already holds port 8000,
          # this unit fails to bind and crash-loops under Restart=always, while
          # `systemctl restart` still exits 0 and the port still answers. The
          # deploy would read as green while the code it just shipped is not
          # running. repo_root settles it: only the service started from this
          # directory reports this directory.
          root=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("repo_root") or "")')
          if [ -n "$root" ] && [ "$root" != "${{ secrets.DEPLOY_PATH }}" ]; then
            echo "::error::Port 8000 is answered by a service running from ${root}, not ${{ secrets.DEPLOY_PATH }}. The unit deployed here is probably failing to bind. Check: systemctl status coverland-forecast-api"
            exit 1
          fi

          # repo_root proves the answering process started from this directory.
          # A process left over from an EARLIER deploy satisfies that too, which
          # is exactly the failure of 2026-08-07: an unmanaged uvicorn held the
          # port for a day while every run reported green. The commit is what
          # tells the two apart, because a stale process reports a stale stamp.
          commit=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit") or "")')
          if [ -z "$commit" ]; then
            echo "::warning::/health reports no commit, so the service predates this mechanism. Expected on the first deploy that ships it; a problem on any later one."
          elif [ "$commit" != "${{ github.sha }}" ]; then
            echo "::error::Port 8000 is answered by commit ${commit}, but this deploy shipped ${{ github.sha }}. The restart did not replace the running process. Check: systemctl status coverland-forecast-api, and ss -lntp | grep 8000"
            exit 1
          else
            echo "Serving commit ${commit}, which is this deploy."
          fi

          ready=$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ready"))')
          if [ "$ready" = "True" ]; then
            echo "Data readiness: ready."
          elif [ "$ready" = "None" ]; then
            echo "::warning::The service answering /health does not report readiness, so it predates this revision. If a restart was expected, it did not take effect."
          else
            missing=$(printf '%s' "$body" | python3 -c 'import json,sys; print(", ".join(json.load(sys.stdin).get("missing_required") or []))')
            echo "::warning::The API is up but has no data to serve. Missing: ${missing:-unknown}. Run scripts/push_data_to_server.sh, or wait for the Monday cron."
          fi
          EOF
